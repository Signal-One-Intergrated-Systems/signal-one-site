name: Import approved full-scene hero (one-time)
on:
  push:
    branches:
      - feat/home-full-bleed-approved-restaurant-20261030
    paths:
      - .github/workflows/import-approved-full-scene-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-full-bleed-approved-restaurant-20261030
          persist-credentials: true
      - name: Retrieve exact approved full-scene PNG
        env:
          ASSET_SOURCE: "https://at.adobe.com/StULpXn2gHPvycSa"
        run: |
          set -euo pipefail
          mkdir -p public/images/home
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$ASSET_SOURCE" -o public/images/home/approved-full-scene-guard-chef-2026.png
          file public/images/home/approved-full-scene-guard-chef-2026.png
          echo "4d3aca7b4da412b9b37963950a7848bdca03a98d217e10401ea8bdbc6caedbd4  public/images/home/approved-full-scene-guard-chef-2026.png" | sha256sum --check
      - name: Commit exact approved asset and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Signal One Site"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/approved-full-scene-guard-chef-2026.png
          git rm -f .github/workflows/import-approved-full-scene-once.yml
          git commit -m "assets(home): add approved full-scene security and chef photograph"
          git push origin HEAD:feat/home-full-bleed-approved-restaurant-20261030
