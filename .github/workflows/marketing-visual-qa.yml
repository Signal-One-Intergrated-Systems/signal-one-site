name: Release gate (build + full browser suite)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/marketing-visual-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/marketing-visual-qa.yml'
  workflow_dispatch:

jobs:
  browser-acceptance:
    # Playwright 1.56.1 requires Ubuntu 24.04; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The whole suite gates a release: pricing, forms, consent, headers, a11y, layout and visuals.
      - run: npx playwright test
      - name: Upload browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-visual-acceptance
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
