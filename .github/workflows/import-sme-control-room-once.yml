name: Import SME security control room photograph
on:
  push:
    branches:
      - feat/sme-guard-control-room-and-ecosystem-home-20261030
    paths:
      - .github/workflows/import-sme-control-room-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sme-guard-control-room-and-ecosystem-home-20261030
          persist-credentials: true
      - name: Import approved SME-scaled control-room concept
        env:
          IMAGE_SOURCE: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:90e3719b-b922-4e8f-8644-3f4bbe58123f"
        run: |
          set -euo pipefail
          mkdir -p public/images/home
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$IMAGE_SOURCE" -o public/images/home/sme-security-control-room.png
          actual="$(head -c 8 public/images/home/sme-security-control-room.png | od -An -tx1 | tr -d ' \\n')"
          test "$actual" = "89504e470d0a1a0a" || { file public/images/home/sme-security-control-room.png; exit 1; }
          test "$(wc -c < public/images/home/sme-security-control-room.png)" -gt 100000
          file public/images/home/sme-security-control-room.png
          sha256sum public/images/home/sme-security-control-room.png
      - name: Commit local illustration and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "Signal One Website Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/sme-security-control-room.png
          git rm -f .github/workflows/import-sme-control-room-once.yml
          git commit -m "assets(home): add realistic SME-scale security control-room image"
          git push origin HEAD:feat/sme-guard-control-room-and-ecosystem-home-20261030
