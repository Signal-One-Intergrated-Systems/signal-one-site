name: Import approved hero image (one-time)
on:
  push:
    branches:
      - fix/approved-guard-chef-home-hero-20261030
    paths:
      - .github/workflows/import-approved-hero-once.yml
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approved-guard-chef-home-hero-20261030
          persist-credentials: true
      - name: Download founder-approved photographic crop
        env:
          IMAGE_SOURCE: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:55eead73-c5e9-465e-821f-2340272bae40"
        run: |
          set -euo pipefail
          mkdir -p public/images/home
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$IMAGE_SOURCE" -o "public/images/home/approved-security-chef-daylight-2026.png"
          actual="$(head -c 8 "public/images/home/approved-security-chef-daylight-2026.png" | od -An -tx1 | tr -d ' \n')"
          if [ "$actual" != "89504e470d0a1a0a" ]; then
            echo "Source did not return PNG bytes; refusing asset commit" >&2
            file "public/images/home/approved-security-chef-daylight-2026.png"
            exit 1
          fi
          test "$(wc -c < "public/images/home/approved-security-chef-daylight-2026.png")" -gt 50000
          file "public/images/home/approved-security-chef-daylight-2026.png"
      - name: Commit hero asset; remove temporary import workflow
        run: |
          set -euo pipefail
          git config user.name "Signal One Website Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/images/home/approved-security-chef-daylight-2026.png"
          git rm -f -- .github/workflows/import-approved-hero-once.yml
          git commit -m "assets(home): add approved chef and security guard hero photograph"
          git push origin HEAD:fix/approved-guard-chef-home-hero-20261030
