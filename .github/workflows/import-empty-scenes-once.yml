name: Import people-free architectural backgrounds
on:
  push:
    branches:
      - fix/person-free-scenes-glass-photos-20261030
    paths:
      - .github/workflows/import-empty-scenes-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/person-free-scenes-glass-photos-20261030
          persist-credentials: true
      - name: Import eight verified people-free backgrounds
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty-scene-sources public/images/backgrounds
          while IFS='|' read -r name source; do
            curl --fail --location --silent --show-error --retry 3 --max-time 120 "$source" -o "/tmp/empty-scene-sources/$name.png"
          done <<'EMPTY_SCENES'
          restaurant-courtyard|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7894222f-2cf4-41f9-84e3-2329866fd385
          business-park|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4782f0a8-ef8f-4fed-8a79-2fea53f4aa2b
          small-control-room|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9220e401-b6ba-4d36-a366-1d91bb4727f7
          restaurant-dining|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:da8b52b6-d431-4ff4-8c92-3da3939ff346
          hotel-lobby|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e4112ece-d78e-4bcf-8093-63ab9c8198d7
          warehouse-yard|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:64002254-2808-4ef3-ace8-21b174c25e2e
          enterprise-showroom|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d92f3a23-c08d-4555-b1ac-b0ebf1fb8247
          hotel-corridor|https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:bfd9f3a4-dac3-44da-bd10-e6ac2621c25a
          EMPTY_SCENES
      - name: Optimize as local responsive WebP images
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          sources=Path("/tmp/empty-scene-sources")
          outputs=Path("public/images/backgrounds")
          names=["restaurant-courtyard","business-park","small-control-room","restaurant-dining","hotel-lobby","warehouse-yard","enterprise-showroom","hotel-corridor"]
          for name in names:
              original=(sources/(name+".png")).read_bytes()
              assert original[:8]==bytes.fromhex("89504e470d0a1a0a"), f"Bad PNG: {name}"
              with Image.open(sources/(name+".png")) as img:
                  img.load()
                  assert img.width>=1200 and img.height>=650,(name,img.size)
                  width=1400
                  photo=img.convert("RGB").resize((width,round(img.height*width/img.width)),Image.Resampling.LANCZOS)
                  target=outputs/(name+".webp")
                  photo.save(target,"WEBP",quality=84,method=6)
                  assert target.stat().st_size>25000,(name,target.stat().st_size)
                  print(name,img.size,target.stat().st_size,hashlib.sha256(target.read_bytes()).hexdigest())
          assert len(list(outputs.glob("*.webp")))==len(names)
          PY
      - name: Commit approved backgrounds and delete this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "Signal One Website Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/backgrounds
          git rm -f .github/workflows/import-empty-scenes-once.yml
          git commit -m "assets(marketing): add eight photoreal empty architectural scenes"
          git fetch origin fix/person-free-scenes-glass-photos-20261030
          git rebase origin/fix/person-free-scenes-glass-photos-20261030
          git push origin HEAD:fix/person-free-scenes-glass-photos-20261030
