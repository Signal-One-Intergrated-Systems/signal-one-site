name: Finalize approved control-room photo import
on:
  push:
    branches:
      - feat/approved-guard-photo-scroll-choreography-20261030
    paths:
      - .github/workflows/finalize-approved-photo-once.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/approved-guard-photo-scroll-choreography-20261030
          persist-credentials: true
      - name: Download verified approved image and commit
        env:
          SOURCE: "https://at.adobe.com/fSV0biQJCVgLErtd"
        run: |
          set -euo pipefail
          mkdir -p public/images/home
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$SOURCE" -o public/images/home/approved-sme-security-control-room-2026.png
          echo "b8efd081d1404ff36c1c5bc1b39d229e6598bb2cc94efe01459b9abaf9467852  public/images/home/approved-sme-security-control-room-2026.png" | sha256sum -c -
          git config user.name "Signal One Website Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/approved-sme-security-control-room-2026.png
          git rm -f .github/workflows/import-approved-control-room-once.yml .github/workflows/finalize-approved-photo-once.yml
          git commit -m "assets(home): install exact approved security control room artwork"
          git fetch origin feat/approved-guard-photo-scroll-choreography-20261030
          git rebase origin/feat/approved-guard-photo-scroll-choreography-20261030
          git push origin HEAD:feat/approved-guard-photo-scroll-choreography-20261030
