name: Public brand guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Check public branding
        run: npm run check:public-brand
