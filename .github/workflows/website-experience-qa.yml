name: Website Experience QA

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/website-experience-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Install image-OCR verification dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      # Next generates image-module declarations and route types during build.
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - run: npx tsc --noEmit
      - name: Capture reviewable homepage evidence
        if: success()
        run: |
          mkdir -p evidence
          node - <<'NODE'
          const { chromium } = require("@playwright/test");
          (async () => {
            const browser = await chromium.launch();
            const { spawn } = require("node:child_process");
            const server = spawn("npx", ["next", "start", "-p", "3150"], { stdio: "ignore" });
            try {
              let ready = false;
              for (let i = 0; i < 60; i++) {
                try { const r = await fetch("http://localhost:3150"); if (r.ok) { ready = true; break; } } catch {}
                await new Promise((resolve) => setTimeout(resolve, 500));
              }
              if (!ready) throw new Error("Screenshot server did not start");
              for (const width of [390, 768, 1440, 1920]) {
                const page = await browser.newPage({ viewport: { width, height: 900 }, reducedMotion: "reduce", deviceScaleFactor: 1 });
                await page.goto("http://localhost:3150", { waitUntil: "networkidle" });
                // Visit every section to load the deferred photographic assets.
                const docHeight = await page.evaluate(() => document.documentElement.scrollHeight);
                for (let y = 0; y < docHeight; y += 700) {
                  await page.evaluate((top) => window.scrollTo(0, top), y);
                  await page.waitForTimeout(85);
                }
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForLoadState("networkidle");
                await page.screenshot({ path: "evidence/home-" + width + ".png", fullPage: true });
                await page.close();
              }
              // Record the actual interactive sequence in a real browser.
              const recording = await browser.newContext({
                viewport: { width: 1280, height: 720 },
                deviceScaleFactor: 1,
                recordVideo: { dir: "evidence", size: { width: 1280, height: 720 } },
              });
              const motionPage = await recording.newPage();
              await motionPage.goto("http://localhost:3150", { waitUntil: "networkidle" });
              await motionPage.locator("#experience").scrollIntoViewIfNeeded();
              await motionPage.waitForTimeout(700);
              for (const stage of [1, 2, 3, 0]) {
                await motionPage.locator(".s1-journey-step").nth(stage).click();
                await motionPage.waitForTimeout(1400);
              }
              await recording.close();
            } finally {
              server.kill("SIGTERM");
              await browser.close();
            }
          })().catch((err) => { console.error(err); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-experience-evidence
          path: evidence/
          if-no-files-found: ignore
