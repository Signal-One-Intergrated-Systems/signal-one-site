  <style>
    :root{--abyss:#0A0D12;--deep:#0F131A;--base:#151A21;--raised:#1C222B;--raised2:#232B36;--line:#2A3340;--line2:#425064;--white:#F1F5F9;--muted:#CBD5E1;--quiet:#94A3B8;--blue:#0EA5E9;--blue2:#38BDF8;--ink:#0B1118;--ease:cubic-bezier(.16,1,.3,1);--fast:180ms;--base-duration:300ms;--enter:440ms}

    body{margin:0;background:var(--deep);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

    .lab-intro h1{font-size:clamp(32px,3.8vw,50px);line-height:1.08;letter-spacing:-.045em;margin:20px 0;font-weight:700}

    .lab-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
    .tool{color:var(--muted);background:var(--raised);border:1px solid var(--line);padding:11px 13px;border-radius:11px;font-size:13px;font-weight:600;min-height:44px;transition:background var(--fast),border-color var(--fast),color var(--fast)}
    .tool[aria-pressed="true"]{color:var(--white);border-color:#487B9E;background:#1B374A}

    .demo-note{padding:16px 0 0;border-top:1px solid var(--line);color:var(--quiet);font-size:13px;line-height:1.6;margin-top:28px}
    .phone-outline{width:100%;max-width:444px;margin-inline:auto;background:#06090D;border:6px solid #28313B;border-radius:48px;padding:7px;box-shadow:0 32px 90px #0007,0 1px 0 #ffffff17 inset;position:relative}

    .logo-lockup{display:inline-flex;align-items:center;gap:10px;min-width:0}
    .mark{height:38px;width:38px;flex:0 0 auto;position:relative}
    .mark svg{display:block;height:100%;width:100%}

    .logo-name{font-size:16px;font-weight:700;line-height:1;letter-spacing:.06em;white-space:nowrap}

    .presenter-direct{display:block;text-decoration:none;font-size:11px;color:var(--blue2);margin-top:17px;overflow-wrap:anywhere}
    .person-block{padding:17px 0 0;margin-top:auto;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
    .person-monogram{width:44px;height:44px;border-radius:12px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:18px;font-weight:680}
    .person-name{font-size:18px;font-weight:680;letter-spacing:-.02em;margin:0}
    .person-job{font-size:12px;color:var(--quiet);margin:4px 0 0}
    .person-copy{display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
    .person-arrow{border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--blue2);flex-shrink:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:13px 18px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:650;line-height:1.2;text-decoration:none;transition:background var(--fast),border-color var(--fast),transform var(--fast);width:100%}

    .btn-secondary{background:#202936;border-color:#445165;color:var(--white)}
    .btn-secondary:hover{background:#2A3645}
    .btn-text{background:transparent;color:var(--muted);padding:10px 15px}
    .btn-text:hover{color:var(--white)}
    .btn-inline{width:auto}
    .subnote{color:var(--quiet);font-size:12px;line-height:1.6}
    .hero{flex:1;display:flex;flex-direction:column;justify-content:center}
    .hero-cue{display:flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--blue2);font-weight:600;font-size:12px;letter-spacing:.03em}
    .cue-line{width:28px;height:1px;background:var(--blue2)}
    .hero h2{font-size:clamp(39px,8vw,51px);line-height:1.045;letter-spacing:-.055em;margin:0 0 23px;font-weight:720}
    .hero h2 span{color:var(--blue2)}
    .hero p{font-size:16px;line-height:1.65;color:var(--muted);margin:0;max-width:340px}
    .welcome-actions{display:grid;gap:8px;margin-top:44px;margin-bottom:8px}
    .visitor-bottom{margin-top:auto;color:var(--quiet);border-top:1px solid var(--line);padding-top:18px;font-size:12px;line-height:1.5}

    .progress span{height:3px;background:#374656;border-radius:4px;flex:1;transition:background var(--base-duration)}
    .progress span.filled{background:var(--blue)}
    .story-stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:320px}
    .story-index{color:var(--blue2);font-size:13px;font-weight:600;letter-spacing:.04em}
    .story-stage h2{font-size:40px;line-height:1.1;letter-spacing:-.05em;margin:17px 0;font-weight:720}

    .story-art svg{width:210px;height:110px;max-width:100%;overflow:visible}
    .story-art line,.story-art path{vector-effect:non-scaling-stroke}

    .story-small{color:var(--quiet);font-size:12px}

    .form-head h2{font-size:32px;line-height:1.15;letter-spacing:-.04em;margin:0 0 11px}
    .form-head p{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 23px}
    .input-grid{display:grid;gap:15px}
    .field{display:grid;gap:7px}
    .field label{font-size:13px;font-weight:650;color:var(--white)}
    .field input,.field textarea{display:block;width:100%;border-radius:11px;background:var(--raised);border:1px solid #5C6A7C;color:var(--white);padding:14px 14px;font-size:16px;min-height:50px;appearance:none}
    .field textarea{resize:vertical;min-height:73px;max-height:160px}
    .field input::placeholder,.field textarea::placeholder{color:#9CAABD}
    .optional{color:var(--quiet);font-size:11px;font-weight:450}

    legend{font-size:14px;font-weight:680;padding:0 0 9px}
    .fieldset-hint{color:var(--quiet);font-size:12px;margin:0 0 11px;line-height:1.5}
    .interest-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .interest{border:1px solid #4B5A6C;border-radius:12px;padding:12px;display:flex;align-items:start;gap:9px;min-height:69px;background:var(--raised);text-align:left;color:var(--muted);font-size:12px;font-weight:570;line-height:1.3}
    .interest:hover{border-color:#6799BA}
    .interest[aria-pressed="true"]{border-color:#3A9FD8;color:#E2F5FF;background:#1C3546}
    .interest-icon{display:grid;place-items:center;flex:0 0 17px;width:17px;height:17px;border-radius:5px;border:1px solid #768597;color:transparent;font-size:12px;font-weight:800}
    .interest[aria-pressed="true"] .interest-icon{color:var(--ink);background:var(--blue2);border-color:var(--blue2)}
    .checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-top:17px;line-height:1.5;font-size:12px;color:var(--muted)}
    .checkbox-row input{appearance:none;width:19px;height:19px;flex:0 0 19px;background:var(--raised);border:1px solid #8190A2;border-radius:5px;margin:0;position:relative;cursor:pointer}

    .success-copy{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 20px}
    .contact-card{background:var(--raised);border:1px solid #4E5B6C;padding:16px;border-radius:15px;display:flex;align-items:center;gap:12px;margin:10px 0 22px}

    .contact-card strong{font-weight:670;font-size:16px}
    .contact-card small{display:block;color:var(--quiet);margin-top:4px;font-size:12px}

    .tag-list{display:flex;flex-wrap:wrap;gap:7px}
    .tag{font-size:12px;padding:8px 10px;border:1px solid #506175;color:var(--muted);border-radius:7px;background:#1A2530}
    .public-note{font-size:11px;color:var(--quiet);line-height:1.6;margin-top:14px}
    .toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#E4F2FA;color:#0A2435;border-radius:10px;box-shadow:0 15px 45px #0009;padding:12px 19px;font-size:14px;font-weight:650;z-index:20;max-width:min(92vw,400px);text-align:center}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .steps-preview{display:flex;gap:6px;margin-top:25px;align-items:center}
    .steps-preview span{height:3px;background:#425364;border-radius:3px;flex:1}
    .steps-preview span:first-child{background:var(--blue)}
    .proto-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
    .mini-link{background:transparent;border:0;color:var(--blue2);font-weight:620;font-size:13px;padding:8px 0;text-decoration:underline;text-underline-offset:4px;text-align:left}
    .no-select{user-select:none}
    @media(max-width:850px){.lab-shell{grid-template-columns:1fr;align-items:start;gap:14px;padding:0;background:var(--abyss)}.lab-intro{order:2;padding:24px 24px 35px;margin:auto;max-width:470px;width:100%;border-top:1px solid var(--line)}.lab-intro h1{font-size:24px;margin:12px 0 8px}.lab-intro p{font-size:13px}.lab-tools{margin-top:15px}.demo-note{margin-top:16px;padding-top:12px}.phone-outline{order:1;max-width:none;border:0;padding:0;border-radius:0;box-shadow:none}.phone-outline:before{display:none}.phone{border-radius:0;min-height:100svh;height:auto;max-height:none;overflow:visible}.screen{min-height:100svh;padding:calc(24px + env(safe-area-inset-top)) 25px calc(24px + env(safe-area-inset-bottom))}}

    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    /* SIGNAL CONNECT — OPTICAL GLASS STUDY V02

  function welcome(){return wrap(`<section class="hero"><div class="hero-cue"><span class="cue-line"></span> AN INTRODUCTION FROM ANDISIWE</div><h2>One promise.<br><span>Everything</span><br>connected.</h2><p>Every operation begins with a promise. Signal One Integrated Systems is bringing together the people, tools and information it takes to keep it.</p><div class="welcome-actions">${btn('Connect with Andisiwe ↗','toForm')}${btn('Explore the Signal One story →','toStory','btn-secondary')}${btn('Save Andisiwe’s contact ↓','saveFromWelcome','btn-text')}</div></section><footer class="visitor-bottom">WIN · HIRE · RUN · EQUIP · PROVE<br><span class="subnote">Five moments. One connected vision.</span></footer>`,'WELCOME');}
  const storyPhotos=['/images/photo/team-briefing.webp','/images/photo/guard-site-operations.webp','/images/story/checkpoint.webp','/images/photo/warehouse-security.webp','/images/photo/control-room-team.webp'];
  const storyDrawings=[
    `<rect x="18" y="24" width="126" height="67" rx="7" stroke="#5F8BA7" fill="#172735"/><path d="M33 71l29-27 24 16 24-30 19 10" fill="none" stroke="#38BDF8" stroke-width="2.5"/><circle cx="110" cy="30" r="5" fill="#0EA5E9"/>`,
    `<circle cx="52" cy="43" r="17" stroke="#38BDF8" fill="none"/><circle cx="111" cy="43" r="17" stroke="#38BDF8" fill="none"/><path d="M26 91c0-24 52-24 52 0M85 91c0-24 52-24 52 0" stroke="#608AA5" fill="none" stroke-width="2"/><path d="M70 44h23" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 5"/>`,
    `<rect x="18" y="13" width="71" height="87" rx="8" fill="#182938" stroke="#608AA5"/><path d="M30 32h47M30 45h35M30 59h47M30 72h27" stroke="#608AA5" stroke-width="2"/><circle cx="108" cy="48" r="22" fill="none" stroke="#38BDF8" stroke-width="2"/><circle cx="108" cy="48" r="7" fill="#0EA5E9"/><path d="M108 24V7M108 89V72M84 48H67M149 48h-17" stroke="#608AA5" stroke-width="1.5"/>`,
    `<rect x="22" y="19" width="41" height="83" rx="8" stroke="#38BDF8" fill="#132534"/><rect x="34" y="31" width="17" height="35" rx="2" fill="#2B4559"/><circle cx="42" cy="82" r="5" fill="#0EA5E9"/><path d="M65 41h35M65 82h35" stroke="#52819D" stroke-dasharray="3 6"/><rect x="103" y="28" width="39" height="62" rx="7" stroke="#38BDF8" fill="#132534"/><circle cx="123" cy="47" r="8" stroke="#0EA5E9" fill="none"/>`,
    `<path d="M27 15H108L135 42V99H27Z" stroke="#607F97" fill="#142532"/><path d="M108 15v27h27" stroke="#607F97" fill="none"/><path d="M45 45h44M45 57h50M45 69h27" stroke="#5F839A" stroke-width="2"/><path d="M90 79l10 9 21-21" stroke="#38BDF8" stroke-width="3" fill="none"/>`
  ];
  function story(){const s=scenes[sceneIndex];return wrap(`<div class="progress" aria-label="Story progress">${scenes.map((x,i)=>`<span class="${i<=sceneIndex?'filled':''}"></span>`).join('')}</div><section class="story-stage" aria-live="polite"><div class="story-art" aria-hidden="true"><img class="story-image" src="${storyPhotos[sceneIndex]}" alt="" loading="eager">${sceneIndex===3?'<div class="device-card"><img src="/images/hardware/hytera-pnc360s.webp" alt=""><img src="/images/hardware/teltonika-fmc920.webp" alt=""><span>Hytera PNC360S · Teltonika FMC920</span></div>':''}</div><div class="story-index">${s.number}</div><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p><p class="story-small" style="margin-top:26px">${esc(s.caption)}</p></section><div class="story-nav">${btn(sceneIndex===0?'← Back':'← Previous','storyPrev','btn-text')}${btn(sceneIndex===scenes.length-1?'Connect ↗':'Continue →','storyNext','btn-primary btn-inline')}</div><div style="text-align:center;margin-top:10px">${btn('Skip story and connect','skipStory','btn-text')}</div>`,'OUR STORY');}
  function form(){const items=options.map(([key,value])=>`<button type="button" class="interest" aria-pressed="${selected.has(key)}" data-interest="${key}"><span class="interest-icon" aria-hidden="true">✓</span><span>${esc(value)}</span></button>`).join('');return wrap(`<div class="form-head"><div class="hero-cue" style="margin-bottom:12px"><span class="cue-line"></span> CONNECT WITH ANDISIWE</div><h2>What can we connect for you?</h2><p>Tell us a little about yourself and what caught your interest. Andisiwe can continue the conversation from there.</p></div><form id="leadForm" novalidate><div class="input-grid"><div class="field"><label for="fullName">Full name *</label><input id="fullName" name="fullName" autocomplete="name" maxlength="120" placeholder="Your full name" required value="${esc(draft.fullName)}"></div><div class="field"><label for="company">Company <span class="optional">(optional)</span></label><input id="company" name="company" autocomplete="organization" maxlength="160" placeholder="Your organisation" value="${esc(draft.company)}"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" inputmode="email" maxlength="190" placeholder="you@company.com" value="${esc(draft.email)}"></div><div class="field"><label for="phone">Contact number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="+27 …" value="${esc(draft.phone)}"></div></div><p class="subnote">Please provide at least one: email or contact number.</p><fieldset><legend>What interests you?</legend><p class="fieldset-hint">Select any that apply. You can discuss the wider platform too.</p><div class="interest-grid">${items}</div></fieldset><div class="field"><label for="notes">Anything else? <span class="optional">(optional)</span></label><textarea id="notes" maxlength="700" placeholder="Tell us what you're exploring…">${esc(draft.notes)}</textarea></div><label class="checkbox-row"><input type="checkbox" id="contactConsent" ${draft.contactConsent?'checked':''}><span>I agree that Signal One may use my details to respond to this enquiry. <a href="https://signalone.co.za/privacy" target="_blank" rel="noopener noreferrer">Privacy notice ↗</a></span></label><label class="checkbox-row"><input type="checkbox" id="marketingConsent" ${draft.marketingConsent?'checked':''}><span>Also send me occasional Signal One product news. <span class="optional">(optional)</span></span></label><div class="submit-area"><div id="formError" class="error hidden" role="alert"></div>${btn('Complete introduction ↗','submitButton')}${btn('Save Andisiwe’s contact instead ↓','saveFromForm','btn-text')}</div><p class="public-note">Details are recorded only if online submission succeeds or if you explicitly send the fallback email. Some services are in development.</p></form><div style="margin-top:20px">${btn('← Back','backFromForm','btn-text')}</div>`,'CONNECT');}
  function success(){const person=esc(lastSubmission?.fullName?.trim().split(/\s+/)[0]||'there'); const tags=lastSubmission?.interests?.length?lastSubmission.interests.map(key=>`<span class="tag">${esc(options.find(p=>p[0]===key)?.[1]||key)}</span>`).join(''):'<span class="tag">General introduction</span>';return wrap(`<section class="hero"><span class="success-icon" aria-hidden="true">✓</span><h2 class="success-head">You're<br>connected, ${person}.</h2><p class="success-copy">A good introduction opens the door to something bigger. Signal One has received your introduction. Andisiwe can continue the conversation.</p><div class="contact-card"><div class="person-monogram">A</div><div><strong>${esc(config.presenter.name)}</strong><small>${esc(config.presenter.role)} · Signal One Integrated Systems</small></div></div>${btn('Save Andisiwe’s contact ↓','saveVcard')}<p class="public-note">Contact file includes the Signal One sales email and website. Andisiwe’s direct details have not yet been approved.</p><div class="confirmation-details"><h3>Your interests</h3><div class="tag-list">${tags}</div></div><p class="public-note">Your introduction was accepted by the Signal One intake service. Contact saving is a separate step.</p><div style="margin-top:19px">${btn('Start another introduction','newIntro','btn-secondary')}</div></section>`,'CONNECTED');}
  function grabDraft(){for(const k of ['fullName','company','email','phone','notes']){const el=document.getElementById(k);if(el)draft[k]=el.value}draft.contactConsent=Boolean(document.getElementById('contactConsent')?.checked);draft.marketingConsent=Boolean(document.getElementById('marketingConsent')?.checked)}
  function bind(){
    const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn)};
    on('toForm',()=>open('form'));on('toStory',()=>open('story',0));on('skipStory',()=>open('form'));on('storyPrev',()=>sceneIndex===0?open('welcome'):open('story',sceneIndex-1));on('storyNext',()=>sceneIndex===scenes.length-1?open('form'):open('story',sceneIndex+1));on('backFromForm',()=>{grabDraft();open('welcome')});
    document.querySelectorAll('[data-interest]').forEach(el=>el.addEventListener('click',()=>{grabDraft();const k=el.dataset.interest;selected.has(k)?selected.delete(k):selected.add(k);el.setAttribute('aria-pressed',String(selected.has(k)))}));
    const formEl=document.getElementById('leadForm');if(formEl)formEl.addEventListener('submit',submit);
    on('submitButton',()=>formEl?.requestSubmit());on('saveVcard',downloadVcard);on('saveFromWelcome',downloadVcard);on('saveFromForm',downloadVcard);on('newIntro',()=>{draft={fullName:'',company:'',email:'',phone:'',notes:'',contactConsent:false,marketingConsent:false};selected=new Set();lastSubmission=null;open('presenter')});
  }
  async function submit(e){
    e.preventDefault();grabDraft();
    const error=document.getElementById('formError');
    const name=draft.fullName.trim(), email=draft.email.trim(), phoneNum=draft.phone.trim();
    let msg='';
    if(!name)msg='Please add your name.';
    else if(!email&&!phoneNum)msg='Please provide an email address or contact number.';
    else if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))msg='Please check your email address.';
    else if(phoneNum&&phoneNum.replace(/\D/g,'').length<7)msg='Please check the contact number.';
    else if(!draft.contactConsent)msg='Please agree to be contacted about this enquiry.';
    if(msg){error.textContent=msg;error.classList.remove('hidden');error.scrollIntoView({block:'nearest'});return;}
    error.classList.add('hidden');
    const chosen=[...selected];
    const data={
      intent:'signal-connect-introduction',presenterId:'andisiwe',presenterName:config.presenter.name,
      fullName:name,company:draft.company.trim(),email,phone:phoneNum,notes:draft.notes.trim(),
      interests:chosen.map(k=>options.find(item=>item[0]===k)?.[1]||k).join(', '),
      consentToReply:'yes',marketingOptIn:draft.marketingConsent?'yes':'no'
    };
    const submitButton=document.getElementById('submitButton');
    if(submitButton){submitButton.disabled=true;submitButton.textContent='Sending introduction…';}
    const unavailable=()=>{
      const lines=['Name: '+name,'Company: '+data.company,'Email: '+email,'Phone: '+phoneNum,
        'Interests: '+data.interests,'Notes: '+data.notes,'Contact consent: yes',
        'Marketing opt in: '+data.marketingOptIn,'Presented by: Andisiwe Satshwa'];
      const href='mailto:sales@signalone.co.za?subject='+encodeURIComponent('Signal Connect introduction — Andisiwe')+'&body='+encodeURIComponent(lines.join('\n').slice(0,1600));
      error.innerHTML='<span class="error-kicker">INTRODUCTION NOT SENT</span><strong>Let’s finish by email.</strong><p>The online connection is unavailable, so no details have been saved. Send your introduction using your email app instead. You can still save Andisiwe’s contact.</p><a class="fallback-send" href="'+href+'">Send introduction by email ↗</a>';
      error.classList.remove('hidden');error.scrollIntoView({block:'nearest'});
      if(submitButton){submitButton.disabled=false;submitButton.classList.add('hidden');}
    };
    try{
      const response=await fetch('/api/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'client',data})});
      if(!response.ok){unavailable();return;}
      lastSubmission={...draft,interests:chosen};open('success');
    }catch{unavailable();}
  }
  function vcardLine(v){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
  function downloadVcard(){const parts=config.presenter.name.trim().split(/\s+/), last=parts.pop(),first=parts.join(' '); const vcard=['BEGIN:VCARD','VERSION:3.0',`N:${vcardLine(last)};${vcardLine(first)};;;`,`FN:${vcardLine(config.presenter.name)}`,'ORG:Signal One Integrated Systems',`TITLE:${vcardLine(config.presenter.role)}`,'EMAIL;TYPE=WORK:sales@signalone.co.za','URL:https://signalone.co.za','NOTE:Company contact details. Direct presenter contact to be approved.','END:VCARD'].join('\r\n')+'\r\n';const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Signal-One-Andisiwe.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);demoToast('Contact file ready. Choose Add Contact on your phone.')}
  async function copy(){try{await navigator.clipboard.writeText(config.proposedUrl);demoToast('Proposed URL copied — it is not live yet.')}catch(e){demoToast('Proposed URL: '+config.proposedUrl)}}
  const switchers={showPresenter:()=>open('presenter'),showVisitor:()=>open('welcome'),showStory:()=>open('story',0),showForm:()=>open('form')};
  Object.entries(switchers).forEach(([id,fn])=>document.getElementById(id)?.addEventListener('click',fn));
  document.getElementById('copyLink')?.addEventListener('click',copy);
  document.getElementById('reset')?.addEventListener('click',()=>{draft={fullName:'',company:'',email:'',phone:'',notes:'',contactConsent:false,marketingConsent:false};selected=new Set();lastSubmission=null;open('presenter')});
  // Swipe is deliberately limited to the dedicated story surface, never the input form.
  let touchX=null;app.addEventListener('touchstart',e=>{if(view==='story')touchX=e.changedTouches[0].screenX},{passive:true});app.addEventListener('touchend',e=>{if(view!=='story'||touchX===null)return;const d=e.changedTouches[0].screenX-touchX;touchX=null;if(Math.abs(d)>65){if(d<0 && sceneIndex<scenes.length-1)open('story',sceneIndex+1);else if(d>0 && sceneIndex>0)open('story',sceneIndex-1)}},{passive:true});
  render();
})();
</script>
</body></html>
